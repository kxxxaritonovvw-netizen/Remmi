<!doctype html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light"><title>Напоминания</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23222222'/%3E%3Cpath d='m8 16 5 5 11-11' fill='none' stroke='white' stroke-width='2'/%3E%3C/svg%3E"><link rel="stylesheet" href="style.css"></head>
<body><div class="app"><nav aria-label="Списки задач" id="navigation"></nav><main><div class="heading"><div><p id="dateLabel"></p><h1 id="heading">Сегодня</h1></div><span id="total"></span></div><div id="tasks"></div><button id="completedToggle" class="completed-toggle"></button><div id="completed"></div></main></div>
<dialog id="editor"><form id="form"><div class="sheet-head"><button type="button" id="cancel">Отмена</button><h2 id="editorTitle">Новая задача</h2><button class="save" type="submit">Готово</button></div><label class="sr-only" for="title">Название задачи</label><textarea id="title" rows="2" placeholder="Что нужно сделать?" maxlength="250" required></textarea><div class="quick"><button type="button" data-offset="0">Сегодня</button><button type="button" data-offset="1">Завтра</button><button type="button" data-offset="7">Через неделю</button></div><div class="field"><label for="date">Дата</label><input id="date" type="date"></div><div class="field"><label for="time">Начало</label><input id="time" type="time" disabled></div><div class="field"><label for="endTime">Окончание</label><input id="endTime" type="time" disabled></div><p id="endNote" class="duration-note"></p><button type="button" id="clearDate" class="secondary">Без даты и времени</button><p class="timezone" id="timezone"></p><button type="button" id="completeEdit" class="complete-edit" hidden>Отметить выполненной</button><button type="button" id="delete" class="delete" hidden>Удалить задачу</button></form></dialog><div id="notice" role="status"></div><script src="app.js"></script></body></html>
