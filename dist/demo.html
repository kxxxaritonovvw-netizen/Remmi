/* Keep navigation above the scrolling content. */
.app{height:100dvh;min-height:0;overflow:hidden}
#navigation{flex-shrink:0}
main{min-height:0;overflow:auto;overscroll-behavior:contain;scrollbar-width:thin;padding-bottom:max(20px,env(safe-area-inset-bottom))}

/* Bottom navbar: content scrolls under a tinted, progressively blurred fade. */
.app{position:relative}
main{padding-bottom:var(--footer-h,140px)}
footer{position:absolute;left:0;right:0;bottom:0;z-index:5;background:none;padding:56px 30px max(20px,env(safe-area-inset-bottom));pointer-events:none}
footer #navigation{position:relative;pointer-events:auto}
.fade{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.fade:after{content:'';position:absolute;inset:0;background:linear-gradient(to bottom,rgb(244 241 246/0) 0%,rgb(244 241 246/.08) 15%,rgb(244 241 246/.2) 30%,rgb(244 241 246/.36) 45%,rgb(244 241 246/.52) 60%,rgb(244 241 246/.66) 75%,rgb(244 241 246/.76) 90%,rgb(244 241 246/.8) 100%)}
.fade i{position:absolute;inset:0}
/* Each blur layer spans only the band its mask shows (stops remapped to the band), so less area is blurred per frame. */
.fade i:nth-child(1){bottom:auto;height:45%;backdrop-filter:blur(.5px);-webkit-backdrop-filter:blur(.5px);mask:linear-gradient(to bottom,#0000 0%,#000 33.333%,#000 66.667%,#0000 100%)}
.fade i:nth-child(2){top:15%;bottom:auto;height:50%;backdrop-filter:blur(1px);-webkit-backdrop-filter:blur(1px);mask:linear-gradient(to bottom,#0000 0%,#000 30%,#000 70%,#0000 100%)}
.fade i:nth-child(3){top:35%;bottom:auto;height:50%;backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);mask:linear-gradient(to bottom,#0000 0%,#000 30%,#000 70%,#0000 100%)}
.fade i:nth-child(4){top:55%;backdrop-filter:blur(3px) saturate(1.2);-webkit-backdrop-filter:blur(3px) saturate(1.2);mask:linear-gradient(to bottom,#0000 0%,#000 33.333%)}
@media all{footer{padding-left:22px;padding-right:22px}}
@media(max-width:380px){footer{padding-left:16px;padding-right:16px}}
/* Rows span the card with a 2px inset so each one can carry its own hover. */
.task-group{padding:2px}
.task-group>.task{position:relative;border-bottom:0;padding:12px 14px;border-radius:22px;transition:background-color .15s ease}
.task-group>.task+.task:before{content:'';position:absolute;top:0;left:14px;right:14px;border-top:1px solid #ededed;transition:opacity .15s ease}
@media(hover:hover){.task-group>.task:hover{background:#F4F1F6}.task-group>.task:hover:before,.task-group>.task:hover+.task:before{opacity:0}}
#tasks>.group,#tasks>.task-group,#completedToggle,#completed>.task-item{transform-origin:50% 0}
/* Inline "add task" row at the bottom of every card. */
.add-task{width:100%;min-height:56px;align-items:center;text-align:left;color:#777;font-size:16px}
.add-task .check{display:flex;align-items:center;justify-content:center;padding:0 5px}
.add-circle{width:22px;height:22px;border-radius:50%;background:#E6E3E9;color:#6f6a74;display:grid;place-items:center}
.add-circle svg{width:12px;height:12px}

/* Dragged events retain an empty, subdued outline at their original time. */
.calendar-event{cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.calendar-event.dragging{cursor:grabbing;z-index:6;box-shadow:0 8px 22px #49345826;outline:1px solid #a093ab;background:#E5DFEB}
.calendar-origin{position:absolute;border:1px dashed #bdb3c5;border-radius:6px;background:rgb(234 230 237 / 35%);pointer-events:none;z-index:1}
.timeline-scroll.is-dragging{cursor:grabbing;scroll-behavior:auto}
/* Bottom tab bar: icon above caption, no segmented pill. */
footer{padding-top:40px;padding-bottom:max(8px,env(safe-area-inset-bottom))}
footer #navigation{height:auto;background:none;padding:0;gap:0;border-radius:0}
footer #navigation button{height:auto;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:6px 0;border:0;background:none;color:#9C96A2;font-size:11px;font-weight:500;letter-spacing:.1px;transition:color .15s ease}
footer #navigation button[aria-pressed="true"]{background:none;border:0;color:#242424}
footer #navigation svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
footer #navigation circle{fill:currentColor;stroke:none}
footer #navigation rect,footer #navigation path{fill:none}
/* Resize handles on calendar events and the draft block for new ones. */
.resize-handle{position:absolute;left:0;right:0;height:10px;cursor:ns-resize;z-index:1}
.resize-handle.top{top:-3px}.resize-handle.bottom{bottom:-3px}
.resize-handle:after{content:'';position:absolute;left:50%;width:18px;height:4px;margin-left:-9px;border-radius:2px;background:#82718e;opacity:0;transition:opacity .15s ease}
.resize-handle.top:after{top:3px}.resize-handle.bottom:after{bottom:3px}
@media(hover:hover){.calendar-event:hover .resize-handle:after{opacity:.45}}
.calendar-event.resizing .resize-handle:after{opacity:.7}
.calendar-event.resizing{cursor:ns-resize}
.calendar-event.short .resize-handle{height:8px}
.calendar-draft{background:#EAE6EDcc;border:1px dashed #a093ab;border-left:3px solid #a093ab;pointer-events:none;z-index:4}
.calendar-draft strong{color:#716778}
/* Mobile sheets slide up from the bottom while the page behind recedes. */
@media(prefers-reduced-motion:no-preference){
dialog.closing{animation:disappear .15s ease-in forwards}
@keyframes disappear{to{opacity:0;transform:translateY(12px)}}
dialog[open]::backdrop{animation:backdrop-in .5s ease-out}
dialog.closing::backdrop{animation:backdrop-out .4s ease-in forwards}
@keyframes backdrop-in{from{opacity:0}}
@keyframes backdrop-out{to{opacity:0}}
@media all{
/* Only transform and opacity animate, so every frame stays on the compositor even at 60 Hz. */
:root{--sheet-in:cubic-bezier(.32,.72,0,1);--sheet-out:cubic-bezier(.3,0,.8,.15)}
.app{transform-origin:50% 0;will-change:transform;transition:transform .4s var(--sheet-in),border-radius 0s .4s}
html.sheet-open .app{transform:translateY(12px) scale(.93);border-radius:22px;transition:transform .5s var(--sheet-in),border-radius 0s}
/* The navbar blur is invisible under the dim layer but costly to re-render while the page scales. */
html.sheet-busy .fade i{backdrop-filter:none;-webkit-backdrop-filter:none}
dialog[open]{will-change:transform;animation:sheet-in .5s var(--sheet-in) both}
dialog.closing{animation:sheet-out .38s var(--sheet-out) forwards}
dialog[open]::backdrop{animation:backdrop-in .5s var(--sheet-in)}
dialog.closing::backdrop{animation:backdrop-out .38s var(--sheet-out) forwards}
@keyframes sheet-in{from{transform:translate3d(0,100%,0)}to{transform:translate3d(0,0,0)}}
@keyframes sheet-out{from{transform:translate3d(0,0,0)}to{transform:translate3d(0,100%,0)}}
}}
footer #navigation{grid-template-columns:repeat(3,1fr)}
/* Settings screen */
.settings-card{padding:2px}
.setting{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;padding:10px 14px;position:relative;cursor:default}
.setting+.setting:before{content:'';position:absolute;top:0;left:14px;right:14px;border-top:1px solid #ededed}
.setting>span:first-child{display:flex;flex-direction:column;gap:2px;min-width:0}

.switch{appearance:none;-webkit-appearance:none;flex-shrink:0;width:48px;height:28px;border-radius:14px;background:#DDD8E2;position:relative;cursor:pointer;margin:0;transition:background-color .2s ease}
.switch:before{content:'';position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px #3a2e4433;transition:transform .2s ease}
.switch:checked{background:#242424}
.switch:checked:before{transform:translateX(20px)}
.switch:focus-visible{outline:2px solid #777;outline-offset:2px}
/* Task sheet: same soft palette and radii as the cards, compact enough to fit without scrolling. */
dialog{border:0;background:#fff;overscroll-behavior:contain;scrollbar-width:none}
dialog::-webkit-scrollbar{display:none}
.sheet-head h2{margin:0}
.sheet-head button{font-size:16px;min-height:44px}

@media(hover:hover){.quick button:hover{background:#EAE6ED}}
.field{padding:8px 0;border-top-color:#ededed}
.field input{background:#F4F1F6;border-radius:10px;padding:8px 10px}
.duration-note{margin:0 0 4px}.duration-note:empty{display:none}
.secondary{min-height:40px;margin-top:4px}

/* Section headings open an inline composer. */
.group-label{min-height:0;padding:0;font:inherit;color:inherit;text-align:left;display:inline-flex;align-items:baseline;transition:color .15s ease}
button.group-label{padding:6px 0;margin:-6px 0}
@media(hover:hover){button.group-label:hover{color:#242424}}
button.group-label[aria-expanded="true"]{color:#242424}
/* main spans the full app width (side padding moves inside it), so rows and lines can reach the screen edges. */
/* One side padding for all main layouts, matching the Header: 20px on every screen width. */
.app{--pad:20px;padding-left:var(--pad);padding-right:var(--pad)}
footer{padding-left:var(--pad);padding-right:var(--pad)}
main{margin-inline:calc(-1*var(--pad));padding-inline:var(--pad)}
/* Plans: full-width 32px section rows, separated by hairlines inset by the side padding; the row tints on hover. */
.app[data-view="all"] #tasks>.group{margin:12px calc(-1*var(--pad)) 0}
.app[data-view="all"] #tasks>.group{position:relative}
.app[data-view="all"] #tasks>.group~.group{margin-top:0}
.app[data-view="all"] #tasks>.group~.group:before{content:'';position:absolute;top:0;left:var(--pad);right:var(--pad);border-top:1px solid #E4E0E8;pointer-events:none}
.app[data-view="all"] .group-label{display:flex;align-items:center;width:100%;height:32px;min-height:32px;margin:0;padding:0 var(--pad);transition:background-color .15s ease,color .15s ease}

.composer{margin:0}

.app[data-view="all"] #tasks>.group-today{font-size:21px;font-weight:600;color:#242424}
main{padding-top:8px}
/* App rows (composer, "add task") that follow a TaskItem in a card get the same divider. */
.task-group>.task-item+.task:before{content:'';position:absolute;top:0;left:14px;right:14px;border-top:1px solid #ededed;transition:opacity .15s ease}
@media(hover:hover){.task-group>.task-item:hover+.task:before{opacity:0}}

/* Header — shared top bar for every tab. Everything about it lives in this file.
   50px tall, 20px side padding from the screen edges, 20px title with an optional 12px caption above it; optional aside on the right. */
.header{flex-shrink:0;height:50px;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-inline:calc(-1*var(--pad,0px));padding:0 20px;background:#F4F1F6;position:relative;z-index:4}
.header__text{min-width:0;display:flex;flex-direction:column;gap:2px}

.header__caption:empty{display:none}
.header__title{margin:0;min-width:0;color:#7A1E32;font-size:20px;font-weight:600;letter-spacing:-.3px;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.header__aside{flex-shrink:0;font-size:20px;line-height:1;font-weight:400;color:#aaa;font-variant-numeric:tabular-nums}
.header__aside:empty{display:none}

/* TaskItem — one task row. Everything about the row lives in this file.
   Rounded row (radius 22) that tints on hover; rows stacked in a card are split by an inset hairline. */
.task-item{position:relative;display:flex;gap:10px;align-items:flex-start;min-height:76px;padding:12px 14px;border-radius:22px;color:#242424;transition:background-color .15s ease}
.task-item:not(:first-child):before{content:'';position:absolute;top:0;left:14px;right:14px;border-top:1px solid #ededed;transition:opacity .15s ease;pointer-events:none}
@media(hover:hover){.task-item:hover{background:#F4F1F6}.task-item:hover:before,.task-item:hover+.task-item:before{opacity:0}}
.task-item button{min-height:44px;margin:0;border:0;background:none;font:inherit;color:inherit;cursor:pointer}
.task-item button:focus-visible{outline:2px solid #777;outline-offset:4px}
.task-item__check{width:34px;flex-shrink:0;padding:10px 5px}
.task-item__circle{display:block;width:22px;height:22px;border:1.4px solid #aaa;border-radius:50%;position:relative}
.task-item__body{flex:1;min-width:0;padding:8px 0;text-align:left}
.task-item__title{display:block;font-size:16px;line-height:1.4;overflow-wrap:anywhere}
.task-item__meta{display:block;margin-top:5px;font-size:12px;color:#777}
.task-item--done .task-item__circle{background:#555;border-color:#555}
.task-item--done .task-item__circle:after{content:'✓';position:absolute;inset:0;color:#fff;font-size:15px;line-height:20px;text-align:center}
.task-item--done .task-item__title{text-decoration:line-through;color:#999}

html,body{height:auto;min-height:100%}
body{display:grid;place-items:center;padding-inline:16px;padding-block:24px;box-sizing:border-box}
.frame{position:relative;width:402px;height:812px;overflow:clip;background:#F4F1F6;box-shadow:0 0 0 1px #CFC8D6,0 20px 50px rgb(52 38 66/.16);zoom:var(--z,1)}
.frame .app{height:100%;max-width:none;margin:0}
.frame dialog{position:absolute;inset:auto 0 0 0;margin:0;z-index:20;max-height:90%}

function bindCalendarCreate(scroll,canvas){
  // Tap an empty slot for a 30-minute event; with a mouse, drag to set its length.
  const pixelsPerMinute=1.6,minuteAt=y=>(y-canvas.getBoundingClientRect().top)/pixelsPerMinute;
  let press=null;
  canvas.addEventListener('pointerdown',event=>{
    if(event.button!==0||!event.isPrimary||event.target.closest('.calendar-event'))return;
    const start=Math.max(0,Math.min(1425,Math.floor(minuteAt(event.clientY)/15)*15));
    press={id:event.pointerId,x:event.clientX,y:event.clientY,start,end:start+30,dragging:false};
  });
  canvas.addEventListener('pointermove',event=>{
    if(!press||event.pointerId!==press.id)return;
    if(!press.dragging&&event.pointerType==='mouse'&&Math.abs(event.clientY-press.y)>5){press.dragging=true;canvas.setPointerCapture(event.pointerId);press.draft=draft(press)}
    if(press.dragging){const end=Math.min(1440,Math.max(press.start+15,Math.ceil(minuteAt(event.clientY)/15)*15));if(end!==press.end){press.end=end;place(press.draft,press)}}
  });
  canvas.addEventListener('pointerup',event=>{
    if(!press||event.pointerId!==press.id)return;
    const state=press;press=null;
    if(!state.dragging&&Math.hypot(event.clientX-state.x,event.clientY-state.y)>8)return;
    const block=state.draft||draft(state);
    openEditor(null,day());$('time').value=clockLabel(state.start);$('time').disabled=false;$('endTime').value=clockLabel(state.end%1440);syncEndTime();
    $('editor').addEventListener('close',()=>block.remove(),{once:true});
  });
  canvas.addEventListener('pointercancel',()=>{press?.draft?.remove();press=null});
  function draft(state){const block=document.createElement('div');block.className='calendar-event calendar-draft';block.setAttribute('aria-hidden','true');block.innerHTML='<strong>Новое событие</strong><small></small>';canvas.append(block);place(block,state);return block}
  function place(block,state){block.style.top=`${state.start*pixelsPerMinute}px`;block.style.height=`${(state.end-state.start)*pixelsPerMinute-2}px`;block.style.left='4px';block.style.width='calc(100% - 8px)';block.querySelector('small').textContent=`${clockLabel(state.start)}–${clockLabel(state.end%1440)}`}
}

{// Scroll reveal: blocks near the bottom edge are smaller and lower, and settle into place as they scroll up.

  // Fade the effect out near the end of the list, so the last blocks can fully settle.
  const settle=Math.min(1,Math.max(0,(main.scrollHeight-main.scrollTop-main.clientHeight)/zone));
  const tops=motion.matches?null:list.map(el=>el.getBoundingClientRect().top-(shifts.get(el)||0));
  list.forEach((el,i)=>{let e=1;if(tops){const p=Math.min(1,Math.max(0,(box.bottom-tops[i])/zone));e=1-(1-p*p*(3-2*p))*settle}
    const shift=(1-e)*40;if(shifts.get(el)===shift)return;shifts.set(el,shift);
    el.style.transform=e<1?`translateY(${shift}px) scale(${.88+.12*e})`:'';el.style.opacity=e<1?.35+.65*e:'';el.style.willChange=e<1?'transform,opacity':''})}
const queue=()=>{if(!frame)frame=requestAnimationFrame(reveal)};

{// Play the exit animation before a dialog actually closes (Отмена, Готово, Esc).
const motion=matchMedia('(prefers-reduced-motion: reduce)');
for(const dialog of document.querySelectorAll('dialog')){
  const close=HTMLDialogElement.prototype.close,show=HTMLDialogElement.prototype.showModal;
  // The page behind a sheet recedes slightly, like iOS card sheets.
  // Reopening mid-exit first completes the pending close, otherwise the page stays receded.
  dialog.showModal=function(){this.finishClose?.();document.documentElement.classList.add('sheet-open','sheet-busy');this.openedAt=performance.now();return show.call(this)};
  dialog.close=function(value){
    if(!this.open||this.classList.contains('closing'))return;
    if(motion.matches){document.documentElement.classList.remove('sheet-open','sheet-busy');return close.call(this,value)}

document.addEventListener('keydown',event=>{const open=document.querySelector('dialog[open]');if(event.key==='Escape'&&open){event.preventDefault();open.close()}});
document.addEventListener('click',event=>{

}
